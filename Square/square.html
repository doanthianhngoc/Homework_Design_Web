<!DOCTYPE html>
<html>

<head>
    <style>
        .square {
            height: 20px;
            width: 20px;
            float: left;
            border: 1px solid gray;
            margin-left: 5px;
            margin-bottom: 5px;
            background: #ff2a00;
        }
    </style>
</head>

<body>

    <script>

        for (var i = 0; i < 5; i++) {

            for (var j = 0; j < 10; j++) {

                document.write("<div class='square'></div>");

            }

            document.write("<div style='clear:both'></div>");

        }

    </script>

</body>

</html>
