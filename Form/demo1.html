<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="emali">Email</label>
        <input type="text" id="email" name="email">
        <br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>
        <label for="gender">Gender</label>
        <input type="radio" id="Male" name="gender" value="Male">
        <label for="Male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="Female">Female</label>
        <br>
        <label for="favorite">Favorite: </label>
        <input type="checkbox" id="checkbox" name="favorite" value="Reading">
        <label for="favorite">Reding</label>
        <input type="checkbox" id="checkbox" name="favorite" value="Swimming">
        <label for="favorite">Swimming</label>
        <br>
        <label for="contry">Contry</label>
        <select name="country" id="contry">
            <option value="USA">USA</option>
            <option value="Cannada">Cannada</option>
            <option value="UK">UK</option>
        </select>
        <br>
        <label for="comment">Comment</label>
        <br>
        <textarea name="comment" id="comment" cols="50%" rows="5"></textarea>
        <br>
        <input type="submit" value="Submit">

    </form>
</body>
</html>
